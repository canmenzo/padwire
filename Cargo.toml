[package]
name = "padwire"
version = "0.1.0"
edition = "2024"
description = "Keyboard and mouse as a virtual PlayStation or Xbox controller for Remote Play"
license = "MIT"
repository = "https://github.com/canmenzo/padwire"

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vigem-client = { version = "0.1.4", features = ["unstable_ds4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Media", "Win32_Media_Multimedia", "Win32_UI_Input_XboxController"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
